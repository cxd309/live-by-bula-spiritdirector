<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tournament · Live! by BULA Spirit Director</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥏</text></svg>"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/v4/index.css" />
    <!--
      theme.js is not deferred: applyInitialTheme() must run before <body>
      paints. tournament.js is a module, so it is deferred automatically,
      and runs after Bootstrap's bundle, for the detail modal
    -->
    <script src="assets/v4/js/theme.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="assets/v4/js/tournament.js"></script>
  </head>

  <body>
    <header class="hero py-4 mb-4">
      <div class="container-fluid d-flex justify-content-between align-items-start">
        <div>
          <a class="small" href="./">&larr; All tournaments</a>
          <h1 id="tournament-name" class="mt-2">Loading&hellip;</h1>
          <p id="tournament-dates" class="lead mb-1"></p>
          <p id="tournament-source" class="mb-0"></p>
        </div>
        <button
          id="theme-toggle"
          type="button"
          class="btn btn-outline-secondary btn-sm"
          aria-label="Toggle light/dark theme"
        >
        </button>
      </div>
    </header>

    <main class="container-fluid">
      <p id="tournament-status" class="text-danger" hidden></p>
      <div id="tournament-overview"></div>
    </main>

    <!-- a game, team or division in full, filled by tournament.js -->
    <div
      class="modal fade"
      id="detail"
      tabindex="-1"
      aria-labelledby="detail-title"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-md-down">
        <div class="modal-content">
          <div class="modal-header align-items-start gap-2">
            <button
              id="detail-back"
              type="button"
              class="btn btn-sm btn-outline-secondary"
              aria-label="Back"
              hidden
            >
              <i class="bi bi-chevron-left"></i>
            </button>
            <div class="me-auto">
              <h2 id="detail-title" class="modal-title fs-5"></h2>
              <p id="detail-meta" class="small text-body-secondary mb-0"></p>
            </div>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            >
            </button>
          </div>
          <div id="detail-body" class="modal-body"></div>
          <div id="detail-footer" class="modal-footer"></div>
        </div>
      </div>
    </div>

    <footer class="container-fluid text-body-secondary small">
      <hr />
      <p>
        Built on
        <a href="https://github.com/cxd309/live-by-bula-openapi"
        >cxd309/live-by-bula-openapi</a>
        and
        <a href="https://github.com/cxd309/ultimate-tournament-results"
        >cxd309/ultimate-tournament-results</a>. Not affiliated with WFDF, EUF,
        BULA or Live! by BULA.
      </p>
    </footer>
  </body>
</html>
