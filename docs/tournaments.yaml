# Tournaments this site knows about, newest first
#
# slug      season id, used verbatim in filenames (casing varies)
# host      live deployment, host plus any path prefix
#           empty for archive only, live is never tried
# version   Live! version, any form live/versions.js accepts ("v1.9.14", "3.0.6")
# archive   ultimate-tournament-results archive URL, empty until archived
#           live is always tried first, the archive is the fallback once the
#           live deployment is gone
# location  where it's played, empty falls back to the live heartbeat's
#           TOURNAMENT_LOCATION (UTR archives don't carry it)

